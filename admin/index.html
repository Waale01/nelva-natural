<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>NELVA Admin</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  /* "Publish to website" bar, shown on top of the admin after login */
  .mz-publish {
    position: fixed; left: 20px; bottom: 20px; z-index: 9999;
    display: flex; align-items: center; gap: 12px;
    background: #1f3d2b; color: #f6efe2;
    padding: 10px 10px 10px 18px;
    font: 14px/1.3 -apple-system, 'Segoe UI', Arial, sans-serif;
    box-shadow: 0 8px 28px rgba(30, 26, 23, 0.28);
    border-radius: 6px;
  }
  .mz-publish[hidden] { display: none; }
  .mz-publish small { display: block; opacity: 0.75; font-size: 12px; }
  .mz-publish button {
    background: #c0703f; color: #fff; border: 0; border-radius: 4px;
    padding: 10px 16px; font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .mz-publish button:hover { background: #d4844f; }
  .mz-publish button:disabled { opacity: 0.6; cursor: wait; }
  .mz-publish a { color: #f6efe2; font-size: 12px; opacity: 0.8; }
  @media (max-width: 600px) { .mz-publish { left: 12px; right: 12px; bottom: 12px; } .mz-publish .mz-text { flex: 1; } }
</style>
</head>
<body>
  <div class="mz-publish" id="mzPublish" hidden>
    <div class="mz-text">
      <strong id="mzStatus">Saved changes go live when you publish</strong>
      <small id="mzSub">Publish once when you’ve finished editing.</small>
    </div>
    <button type="button" id="mzPublishBtn">Publish to website</button>
    <a href="/admin/guide.html" target="_blank" rel="noopener">Help</a>
  </div>

  <script src="https://unpkg.com/decap-cms@3.17.1/dist/decap-cms.js"></script>
  <script src="/admin/admin-guards.js"></script>
  <script>
    // ---- Live preview of a product card, styled like the shop ----
    CMS.registerPreviewStyle('/css/styles.css');
    CMS.registerPreviewTemplate('products', createClass({
      render: function () {
        var e = this.props.entry;
        var get = function (k) { return e.getIn(['data', k]); };
        var img = get('image') ? this.props.getAsset(get('image')) : null;
        var price = get('price');
        var soon = get('status') === 'coming-soon';
        var badge = get('sold_out') ? 'Sold Out' : soon ? 'Coming Soon' : get('badge');
        var priceText = soon || !price ? 'TBA' : '₦' + Number(price).toLocaleString('en-NG');
        return h('div', { style: { padding: '32px', maxWidth: '320px' } },
          h('article', { className: 'product-card' + (soon ? ' coming-soon' : '') },
            h('div', { className: 'product-photo' },
              badge ? h('span', { className: 'product-badge' }, badge) : null,
              img ? h('img', { src: img.toString(), alt: '' }) : h('p', { style: { padding: '40px 0', color: '#6b6656' } }, 'Add a photo')),
            h('div', { className: 'product-info' },
              h('span', { className: 'cat' }, get('label') || ''),
              h('h4', null, get('title') || get('name') || 'Product name'),
              h('p', { className: 'desc' }, get('card_text') || ''),
              h('div', { className: 'price-row' }, h('span', { className: 'price' }, priceText)))));
      },
    }));

    // ---- "Publish to website" button ----
    // Saving in the admin does not deploy (commits use [skip netlify]); this button starts ONE Netlify build.
    // The build hook address is created in Netlify (Project configuration -> Build & deploy -> Build hooks)
    // and pasted once; it is remembered in this browser only.
    (function () {
      var bar = document.getElementById('mzPublish');
      var btn = document.getElementById('mzPublishBtn');
      var status = document.getElementById('mzStatus');
      var sub = document.getElementById('mzSub');
      var KEY = 'nelva_build_hook';
      var isLocal = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);

      function getHook() {
        try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; }
      }
      function askHook() {
        var url = prompt('One-time setup: paste the Netlify build hook address\n(it starts with https://api.netlify.com/build_hooks/)');
        if (!url) return '';
        url = url.trim();
        if (!/^https:\/\/api\.netlify\.com\/build_hooks\/[a-z0-9]+$/i.test(url)) {
          alert('That doesn’t look like a Netlify build hook address. Please copy it again from Netlify.');
          return '';
        }
        try { localStorage.setItem(KEY, url); } catch (e) { /* private mode */ }
        return url;
      }

      btn.addEventListener('click', function () {
        if (isLocal) {
          status.textContent = 'Test mode on this computer';
          sub.textContent = 'Changes are saved straight to the files; nothing is published.';
          return;
        }
        var hook = getHook() || askHook();
        if (!hook) return;
        if (!confirm('Publish all your saved changes to the website now?\n\n' +
          'The live site updates in about 1–2 minutes. Each publish uses part of the monthly allowance, ' +
          'so publish once when you have finished editing.')) return;
        btn.disabled = true;
        status.textContent = 'Publishing…';
        fetch(hook, { method: 'POST', mode: 'no-cors' })
          .then(function () {
            status.textContent = 'Publishing started ✓';
            sub.textContent = 'Your changes will be live in about 1–2 minutes.';
          })
          .catch(function () {
            status.textContent = 'Could not reach Netlify';
            sub.textContent = 'Check your internet connection and try again.';
          })
          .then(function () { setTimeout(function () { btn.disabled = false; }, 15000); });
      });

      // Show the bar once logged in (the Decap app is on the page)
      var t = setInterval(function () {
        if (document.querySelector('[class*="AppHeader"], header nav, #nc-root header')) {
          bar.hidden = false;
          clearInterval(t);
        }
      }, 800);
    })();
  </script>
</body>
</html>
