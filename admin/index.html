<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1f3d2b">
<title>NELVA Dashboard</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/dashboard.css">
</head>
<body>
  <!-- NELVA owner's dashboard: sales, orders, stock. Code in /admin/dashboard.js.
       Product details are edited in the editor at /admin/editor/ (Decap CMS). -->
  <!-- Sidebar: laptops and big screens only (phones use the tabs at the bottom) -->
  <aside class="side" id="side" hidden>
    <div class="side-brand"><span class="logo">N</span><span><strong>NELVA</strong><small>Natural · Admin</small></span></div>
    <nav class="side-nav" aria-label="Dashboard sections">
      <button type="button" data-go="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg><span>Dashboard</span></button>
      <button type="button" data-go="orders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span>Orders</span><b class="side-count" id="sideOrders" hidden></b></button>
      <button type="button" data-go="sell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h3l2.7 12.4a2 2 0 0 0 2 1.6h8.6a2 2 0 0 0 2-1.6L22 7H6"/></svg><span>I sold something</span></button>
      <button type="button" data-go="stock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/></svg><span>Stock</span><b class="side-count warn" id="sideStock" hidden></b></button>
      <button type="button" data-go="money"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15v3"/><path d="M12 10v8"/><path d="M17 6v12"/></svg><span>Money report</span></button>
    </nav>
    <div class="side-foot">
      <a href="/admin/editor/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><span>Edit products</span></a>
      <button type="button" data-act="publish"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15c-1.5 1.3-2 5-2 5s3.7-.5 5-2c.7-.8.7-2.1-.1-2.9a2.2 2.2 0 0 0-2.9-.1z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.9A12.9 12.9 0 0 1 22 2c0 2.7-.8 7.5-6 11a22 22 0 0 1-4 2z"/><path d="M9 12H4s.6-3 2-4c1.6-1.1 5 0 5 0"/><path d="M12 15v5s3-.6 4-2c1.1-1.6 0-5 0-5"/></svg><span>Publish website</span></button>
      <a href="/" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18 14 14 0 0 1 0-18"/></svg><span>Open website</span></a>
      <a href="/admin/guide.html" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg><span>Help</span></a>
      <button type="button" data-act="logout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg><span>Log out</span></button>
    </div>
  </aside>

  <header class="top">
    <div class="brand"><strong>NELVA</strong><span>Dashboard</span></div>
    <h1 class="top-title" id="topTitle"></h1>
    <div class="top-actions" id="topActions" hidden>
      <span class="demo-pill" id="demoPill" hidden>Practice<span class="wide-only"> mode</span></span>
      <button type="button" class="pub-pill" id="pubPill" data-act="publish" hidden>🚀 Publish<span class="wide-only"> changes</span></button>
      <span class="date-pill" id="datePill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span id="dateText"></span></span>
      <button type="button" class="icon-btn bell" data-go="orders" aria-label="Orders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><b class="dot" id="bellDot" hidden></b></button>
      <button type="button" class="icon-btn" data-act="refresh" aria-label="Refresh">⟳</button>
      <button type="button" class="icon-btn menu-btn" data-act="menu" aria-label="Menu">☰</button>
      <button type="button" class="btn terra small sale-btn" data-go="sell">＋ Record a sale</button>
    </div>
  </header>

  <main id="view" class="view" aria-live="polite">
    <div class="loading"><div class="leaf">🌿</div><p>Loading…</p></div>
  </main>

  <nav class="tabs" id="tabs" hidden aria-label="Dashboard sections">
    <button type="button" data-go="home"><span class="ti">🏠</span><span>Home</span></button>
    <button type="button" data-go="orders"><span class="ti">🔔<b class="dot" id="ordersDot" hidden></b></span><span>Orders</span></button>
    <button type="button" data-go="sell" class="tab-sell"><span class="ti">🛒</span><span>Sell</span></button>
    <button type="button" data-go="stock"><span class="ti">📦<b class="dot warn" id="stockDot" hidden></b></span><span>Stock</span></button>
    <button type="button" data-go="money"><span class="ti">📊</span><span>Money</span></button>
  </nav>

  <div class="sheet-wrap" id="sheetWrap" hidden>
    <div class="sheet-bg" data-act="close-sheet"></div>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true"></section>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="/admin/publish.js"></script>
  <script src="/admin/dashboard.js"></script>
</body>
</html>
